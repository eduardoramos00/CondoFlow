# CondoFlow — Supabase local development configuration
# Docs: https://supabase.com/docs/guides/cli/config
project_id = "condoflow"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv4"

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = true

[auth]
enabled = true
# Site URL for redirect callbacks — update for production
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Disable for local dev; enable for production to require email verification
enable_confirmations = false
secure_password_change = true

[auth.email.template.invite]
subject = "Bem-vindo ao CondoFlow"

[auth.email.template.confirmation]
subject = "Confirme o seu email — CondoFlow"

[auth.email.template.magic_link]
subject = "O seu link de acesso — CondoFlow"

[auth.email.template.recovery]
subject = "Recuperação de password — CondoFlow"

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[analytics]
enabled = true
port = 54327
backend = "postgres"

# ─── Edge Functions ───────────────────────────────────────────────────────────
# Schedule (0 7 * * *) is configured via Supabase Dashboard → Edge Functions,
# not in config.toml — schedule key is unsupported locally.
[functions."overdue-quota-sweep"]
verify_jwt = false
